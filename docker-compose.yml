services:
  postgres:
    image: postgres:16
    container_name: moorlife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moorlife_marketplace
    ports:
      - "5432:5432"
    volumes:
      - moorlife_postgres_data:/var/lib/postgresql/data

volumes:
  moorlife_postgres_data: